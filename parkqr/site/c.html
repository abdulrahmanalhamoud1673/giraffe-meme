<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css?v=20261127k">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>رسالة لصاحب السيارة — يا نشمي</title>
<meta name="robots" content="noindex">
</head>
<body>
<div class="band" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <span class="logo">يا نشمي</span>
    <span class="pill" id="lockPill"></span>
  </header>
  <main>
    <section id="pick" hidden>
      <div class="who">
        <span class="ic" id="whoIc"></span>
        <div class="grow"><b id="whoName">صاحب السيارة</b><small id="whoSub">رقمه مخفي</small></div><span class="codeTag" id="codeLine" dir="ltr"></span>
      </div>
      <div class="askRow"><h1>شو بدك تقوله؟</h1></div>
      <button class="noteToggle" id="noteToggle" type="button">+ ملاحظة <small>(اختياري)</small></button>
      <input class="noteIn" id="noteIn" maxlength="80" placeholder="مثلاً: عند مدخل العمارة" autocomplete="off" hidden>
      <div id="list"></div>
      <p class="err" id="err" role="alert" style="margin-top:14px"></p>
      <p class="note" style="margin-top:10px;text-align:center">للطوارئ: 911</p>
    </section>

    <section id="cam" hidden>
      <div class="camTop"><button class="camX" id="camBack" type="button" aria-label="رجوع"></button><span id="camTitle">صوّر المشكلة</span></div>
      <div class="camBox"><video id="vid" playsinline muted autoplay></video><img id="shot" alt="" hidden>
        <div class="camMsg" id="camErr" role="alert"></div></div>
      <div class="camBar">
        <button class="shutter" id="snap" type="button" aria-label="التقط"><i></i></button>
        <button class="cta alt" id="retake" type="button" hidden>إعادة</button>
        <button class="cta" id="sendPhoto" type="button" hidden>أرسل</button>
      </div>
    </section>

    <section id="sent" hidden></section>

    <section id="bad" hidden>
      <h1 id="badTitle">الرابط غير صحيح</h1>
      <p class="lead" id="badText">تأكد إنك مسحت الرمز بشكل كامل.</p>
      <p class="note" id="dbg" dir="ltr"></p>
    </section>
  </main>
</div>
<script src="/shared.js?v=20261127k"></script>
<script src="/camera.js?v=20261127k"></script>
<script>
const token=new URLSearchParams(location.search).get('t')||(location.pathname.match(/\/c\/([a-z0-9]+)/i)||[])[1]||'';
const $=id=>document.getElementById(id);
$('lockPill').innerHTML=ICON.lock+'رقمه مخفي';
$('whoIc').innerHTML=ICON.block;
$('camBack').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function view(id){for(const v of ['pick','cam','sent','bad'])$(v).hidden=v!==id}
function build(){
  const list=$('list');
  for(const [title,keys] of GROUPS){
    const g=document.createElement('div');g.className='group';g.textContent=title;list.appendChild(g);
    const box=document.createElement('div');box.className='stack';
    keys.forEach((k,i)=>{
      const b=document.createElement('button');b.className='opt'+(k==='block'?' primary':'');
      b.innerHTML='<span class="ic">'+ICON[k]+'</span><span></span>';b.lastChild.textContent=MSG[k];if(PHOTO_KINDS.includes(k)){const t=document.createElement('span');t.className='camTag';t.innerHTML=ICON.camera+'صورة';b.appendChild(t)}
      b.onclick=()=>PHOTO_KINDS.includes(k)?openCam(k):send(k);box.appendChild(b);
    });
    list.appendChild(box);
  }
}
async function init(){
  try{
    const car=await api('/car?t='+encodeURIComponent(token));
    if(car.paused){$('badTitle').textContent='صاحب السيارة مش متاح حالياً';$('badText').textContent='أوقف استقبال الرسائل مؤقتاً. جرب بعد شوي.';view('bad');return}
    if(car.nickname)$('whoName').textContent=car.nickname;
    if(car.replyMinutes)$('whoSub').textContent='بيرد غالباً خلال حوالي '+car.replyMinutes+(car.replyMinutes<=2?' دقيقة':' دقائق')+'. رقمه مخفي.';
    try{$('codeLine').textContent=shortCode(token)}catch(_){}build();$('noteToggle').onclick=()=>{$('noteToggle').hidden=true;$('noteIn').hidden=false;$('noteIn').focus()};view('pick');
  }catch(e){$('dbg').textContent='debug: token='+token+' | path='+location.pathname+' | '+(e.status||'network')+' '+(e.code||e.message||'');view('bad')}
}
async function send(kind,photo){
  $('err').textContent='';
  for(const b of document.querySelectorAll('.opt'))b.disabled=true;
  try{
    const r=await api('/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,kind,photo,note:$('noteIn').value.trim()})});
    stopCam();view('sent');window.scrollTo(0,0);startConversation(r.id,kind,r.photo_dropped);
  }catch(e){
    for(const b of document.querySelectorAll('.opt'))b.disabled=false;
    if(photo){view('cam');$('camErr').textContent=({photo_unrelated:'الصورة ما بتبيّن السيارة أو مشكلتها. صوّر المشكلة بوضوح وجرّب كمان مرة.',bad_photo:'الصورة مش صالحة. أعد التصوير.',note_rejected:'الملاحظة ما انقبلت. ارجع وعدّلها أو شيلها.',wait:'حاولت كثير. استنى كم دقيقة.'})[e.code]||'صار خطأ، جرّب كمان مرة.';$('retake').click();return}
    const m={note_rejected:'الملاحظة ما انقبلت. اكتب شي بسيط عن السيارة أو المكان، أو شيلها.',wait:'أرسلت رسالة قبل شوي. استنى 5 دقائق قبل ما ترسل ثانية.',daily_limit:'وصلت صاحب السيارة رسائل كثيرة اليوم.',paused:'صاحب السيارة مش متاح حالياً.'};
    $('err').textContent=m[e.code]||('صار خطأ، جرب كمان مرة. (رمز: '+(e.status||'شبكة')+' '+(e.code||'')+' '+(e.detail||'')+')');
    for(const b of document.querySelectorAll('.opt'))b.disabled=false;
  }
}

// ---- live camera: no gallery. The picture is taken from the video stream, so it cannot be an old or edited file.
let stream=null,pending=null;
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function openCam(kind){
  pending=kind;view('cam');$('camErr').textContent='';$('shot').hidden=true;$('vid').hidden=false;
  $('snap').hidden=false;$('retake').hidden=true;$('sendPhoto').hidden=true;$('sendPhoto').disabled=false;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
    $('vid').srcObject=stream;
  }catch(e){
    $('camErr').textContent=e&&e.name==='NotAllowedError'?'فعّل الكاميرا من إعدادات المتصفح وجرّب كمان مرة.':'ما قدرنا نفتح الكاميرا.';
    $('snap').hidden=true;
  }
}
$('snap').onclick=()=>{
  const v=$('vid');if(!v.videoWidth)return;
  const w=Math.min(960,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);
  let q=.72,d=c.toDataURL('image/jpeg',q);while(d.length>250000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}
  window.__photo=d;$('shot').src=d;$('shot').hidden=false;$('vid').hidden=true;
  $('snap').hidden=true;$('retake').hidden=false;$('sendPhoto').hidden=false;
};
$('retake').onclick=()=>{window.__photo=null;if(stream){$('shot').hidden=true;$('vid').hidden=false;$('snap').hidden=false;$('retake').hidden=true;$('sendPhoto').hidden=true}else openCam(pending)};
$('sendPhoto').onclick=()=>{$('sendPhoto').disabled=true;send(pending,window.__photo)};
$('camBack').onclick=()=>{stopCam();view('pick')};

// ---- the conversation screen (WhatsApp style), shown right after sending
const CHAT_ERR={wait_owner:'استنى ردّ صاحب السيارة.',text_rejected:'الرسالة ما انقبلت. اكتب بالعربي وبأدب، بدون أرقام أو روابط.',slow:'استنى ثواني قبل الرسالة الجاية.',closed:'انتهت المحادثة.',limit:'وصلت الحد الأقصى للمحادثة.',photo_unrelated:'الصورة ما بتبيّن السيارة. صوّر المشكلة بوضوح.',bad_photo:'الصورة مش صالحة. صوّر من جديد.',photo_check_down:'فحص الصور مش متاح هلأ. ابعت كتابة أو جرّب بعد شوي.'};
let sentInfo=null,replyAt=0,replyKey=null,nudgeDone=false,nudgeTimer=null;
function startConversation(id,kind,noPhoto){
  const t0=Math.floor(Date.now()/1000);sentInfo={id,kind,t0};document.body.classList.add('chatMode');
  const box=$('sent');
  mountChat(box,{
    title:'صاحب السيارة',
    status:r=>!r.open?'انتهت المحادثة':replyKey?'ردّ عليك':'وصلت رسالتك · بانتظار ردّه',
    errText:c=>CHAT_ERR[c],
    photoUrl:m=>'/api/chat-photo?id='+encodeURIComponent(id)+'&c='+encodeURIComponent(m.id),
    send:b=>api('/chat?id='+encodeURIComponent(id),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),
    load:async()=>{
      let reply=null;try{reply=(await api('/status?id='+encodeURIComponent(id))).reply||null}catch(_){}
      if(reply&&!replyKey){replyKey=reply;replyAt=Math.floor(Date.now()/1000)}
      let chat={open:true,messages:[]};try{chat=await api('/chat?id='+encodeURIComponent(id))}catch(_){}
      const items=[{id:'first',mine:true,text:MSG[kind],t:t0}];
      if(noPhoto)items.push({sys:1,text:'وصلت رسالتك بدون الصورة، لأنه فحص الصور مش متاح هلأ.'});
      if(!replyKey)items.push({sys:1,text:'بانتظار ردّه…'});
      else items.push({id:'reply',mine:false,text:REPLY[replyKey],t:replyAt});
      if(nudgeDone&&!replyKey)items.push({sys:1,text:'ذكّرناه.'});
      for(const m of chat.messages)items.push({id:m.id,mine:m.side==='s',text:m.text,photo:!!m.photo,t:m.t});
      return {open:chat.open,items};
    },
  });
  const box2=$('sent');box2.querySelector('input').id='chatIn';box2.querySelector('.chatErr').id='chatErr';box2.querySelector('.camBtn').id='chatCam';box2.querySelector('.chatMsgs').id='chatList';
  startNudge(id);
}
// Automatic second alert: 2 minutes without a reply -> we alert the owner again (once).
const NUDGE_AFTER=120;
function startNudge(id){
  const at=Date.now();clearTimeout(nudgeTimer);
  const go=async()=>{
    if(replyKey||nudgeDone)return;
    try{await api('/nudge',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});nudgeDone=true}
    catch(e){const w=e.data&&e.data.wait;if(e.code==='too_soon'&&w){nudgeTimer=setTimeout(go,(w+1)*1000)}else if(e.code==='already_nudged'||e.code==='already_replied'||e.code==='paused')nudgeDone=true}
  };
  nudgeTimer=setTimeout(go,Math.max(0,NUDGE_AFTER*1000-(Date.now()-at)));
}
init();
</script>
</body>
</html>
