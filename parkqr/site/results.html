<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>نتائج الاستبيان</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;line-height:1.7}
input,button{font:inherit;padding:8px;margin:4px 0}pre{white-space:pre-wrap;background:#0001;padding:12px;border-radius:8px}</style></head>
<body><h1>نتائج الاستبيان</h1>
<input id="k" type="password" placeholder="مفتاح الإدارة"> <button id="go">عرض</button>
<div id="out"></div>
<script>
const L={sure:'أكيد',probably:'غالباً',maybe:'ممكن',no:'لا'};
document.getElementById('go').onclick=async()=>{
  const r=await fetch('/api/results',{headers:{authorization:'Bearer '+document.getElementById('k').value}});
  const o=document.getElementById('out');
  if(!r.ok){o.textContent='مفتاح غلط';return}
  const d=await r.json();
  const w=d.counts.would_use||{};
  const yes=(w.sure||0)+(w.probably||0);
  const pct=d.total?Math.round(100*yes/d.total):0;
  o.innerHTML='<h2>عدد الإجابات: '+d.total+'</h2><p>"أكيد" أو "غالباً": <b>'+pct+'%</b> (الهدف 40%)</p><pre></pre>';
  o.querySelector('pre').textContent=JSON.stringify(d.counts,null,2)+'\n\nجهات اتصال:\n'+d.contacts.join('\n');
};
</script></body></html>
