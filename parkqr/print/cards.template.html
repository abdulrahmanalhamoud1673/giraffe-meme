<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>كروت يا نشمي A4</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:'IBM Plex Sans Arabic',sans-serif;color:#15120f;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{width:210mm;height:297mm;padding:11mm 10mm;background:#fff;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:0}
.card{position:relative;display:flex;flex-direction:column;overflow:hidden;background:#fbf8f2;outline:0.25mm dashed #9a9186;outline-offset:-0.1mm}
.band{height:6mm;flex:none;background:conic-gradient(#b3122a 25%,#fff 0 50%,#b3122a 0 75%,#fff 0) 0 0/3mm 3mm}
.in{flex:1;display:flex;align-items:center;gap:5mm;padding:3mm 6mm 3mm}
.qr{flex:none;width:36mm;background:#fff;padding:2.2mm;border-radius:2.5mm;box-shadow:0 0 0 0.45mm #15120f}
.qr svg{display:block;width:100%;height:auto}
.tx{flex:1;min-width:0}
.k{font-size:8.5pt;color:#b3122a;font-weight:600}
.n{font-family:'Reem Kufi',sans-serif;font-weight:700;font-size:23pt;line-height:1.15;margin:0.5mm 0 1.5mm;display:flex;align-items:center;gap:2mm}
.n svg{width:6.5mm;height:6.5mm;color:#0b6b43}
.d{font-size:9.2pt;line-height:1.55;color:#3a342d}
.u{margin-top:2.2mm;display:inline-block;direction:ltr;font-weight:600;font-size:10.5pt;background:#15120f;color:#fff;border-radius:99px;padding:0.7mm 4mm}
</style>
</head>
<body>
<div class="sheet">
__CARDS__
</div>
</body>
</html>
